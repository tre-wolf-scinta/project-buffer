# Optional local PostgreSQL for development. Not used in production.
#   docker compose up -d
#   DATABASE_URL=postgresql://buffer:buffer@localhost:5432/buffer
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: buffer
      POSTGRES_PASSWORD: buffer
      POSTGRES_DB: buffer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - buffer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buffer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  buffer-pgdata:
