[project]
name = "project-buffer"
version = "0.1.0"
description = "Private single-user co-parenting communication buffer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=42",
    "twilio>=9",
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.50",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "beautifulsoup4>=4.12",
    "types-beautifulsoup4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:twilio.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in argument defaults
    "RUF012", # SQLAlchemy/pydantic class attributes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"project_buffer/seed.py" = ["S311"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["twilio.*", "pyotp.*", "argon2.*"]
ignore_missing_imports = true
