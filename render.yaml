# Render Blueprint: always-on web service, background worker, managed Postgres.
#
# Nothing here is free tier. Free web services sleep, and a sleeping service
# would miss or delay Twilio webhooks.
#
# Secrets are NOT in this file. After the Blueprint is created, add them once to
# the "buffer-config" environment group (see README, "Deploying to Render").
# Both services read the same group, so the web service and the worker can never
# end up with different encryption keys.
#
# Plan names follow Render's Blueprint reference at the time of writing. If the
# dashboard rejects one when you apply the Blueprint, pick the smallest paid
# always-on plan it offers.

databases:
  - name: buffer-db
    databaseName: buffer
    plan: 0.1c-256mb
    region: virginia
    postgresMajorVersion: "16"
    ipAllowList: [] # no access from outside Render's private network

envVarGroups:
  - name: buffer-config
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SMS_PROVIDER
        value: twilio
      - key: LLM_PROVIDER
        value: anthropic
      - key: OWNER_TIMEZONE
        value: America/Chicago
      - key: NOTIFY_MODE
        value: summary
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      # Add these in the dashboard after creation (values are never committed):
      #   APPLICATION_BASE_URL, RAW_MESSAGE_ENCRYPTION_KEY,
      #   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_PHONE_NUMBER,
      #   COPARENT_PHONE_NUMBER, OWNER_PHONE_NUMBER,
      #   COPARENT_DISPLAY_NAME, OWNER_DISPLAY_NAME, CHILDREN_NAMES, SMS_BRAND_NAME,
      #   ANTHROPIC_API_KEY (or OPENAI_API_KEY with LLM_PROVIDER=openai)

services:
  - type: web
    name: buffer-web
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    # Migrations run before the new version takes traffic. A failed migration stops the deploy.
    preDeployCommand: alembic upgrade head
    startCommand: >-
      uvicorn project_buffer.web.app:create_app --factory
      --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health/ready
    envVars:
      - fromGroup: buffer-config
      - key: DATABASE_URL
        fromDatabase:
          name: buffer-db
          property: connectionString

  - type: worker
    name: buffer-worker
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: python -m project_buffer.worker
    envVars:
      - fromGroup: buffer-config
      - key: DATABASE_URL
        fromDatabase:
          name: buffer-db
          property: connectionString
